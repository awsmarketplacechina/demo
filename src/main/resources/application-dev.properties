# Server Configuration
server.port=8080

# Spring MVC Configuration
spring.mvc.view.prefix=/templates/
spring.mvc.view.suffix=.html

# Database Configuration (Development)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/aliyun_demo}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Additional Database Properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Aliyun OSS Configuration (Development)
aliyun.oss.endpoint=https://oss-cn-hangzhou.aliyuncs.com
aliyun.oss.accessKeyId=your-dev-access-key-id
aliyun.oss.accessKeySecret=your-dev-access-key-secret
aliyun.oss.bucketName=your-dev-bucket-name

# Aliyun Deployment Configuration (Development)
aliyun.deployment.ecsHost=your-dev-ecs-host
aliyun.deployment.sshUsername=root
aliyun.deployment.sshPrivateKey=your-dev-private-key
aliyun.deployment.region=cn-hangzhou
